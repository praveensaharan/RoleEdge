[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "roleedge"
version = "0.1.0"
description = "roleEdge: keeps busy children close to a parent who lives alone - agents, gates and the trend engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
    "icalendar>=5.0",
    "playwright>=1.44",
    "websockets>=12",
    "python-multipart>=0.0.9",
    "yt-dlp>=2026.8",
    "cryptography>=42",
    "pillow>=10",  # a product cut out of a reel's still (SAM 3.1 finds it)  # connected accounts' tokens are stored encrypted (connectors/vault.py)  # reel and post links: download the video and its caption (content/social.py)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
roleedge = "roleedge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roleedge = ["render/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# E501: prompts and HTML templates contain long literal lines on purpose.
ignore = ["E501"]
