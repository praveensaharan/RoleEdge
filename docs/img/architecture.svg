<line x1="681" y1="507.0" x2="697" y2="507.0" stroke="#3f3f46" stroke-width="1.4" marker-end="url(#a)"/>
<text x="44" y="590" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="start">Everything shown or said to her passes the send gate first. Your shares wait for your approval (unless you turn that off); answers to her own questions go to her directly.</text>
